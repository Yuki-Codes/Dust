name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: Apple-Actions/xcodebuild@v1
        with:
          project: Dust.xcodeproj
          scheme: Dust
          sdk: macosx
          build-number: ${{ github.run_number }}
