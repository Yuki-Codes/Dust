name: Build Dust

permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - run: xcodebuild -scheme 'Dust' build CONFIGURATION_BUILD_DIR=/.build/
